services:
  web:
    build:
      context: .
    # image: pride-agent-all-in-one-local:latest
    container_name: pride-agent-web
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AGENT_LLM_API_KEY=${AGENT_LLM_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - AGENT_LLM_BASE_URL=${AGENT_LLM_BASE_URL:-https://api.deepseek.com}
      - AGENT_LLM_MODEL=${AGENT_LLM_MODEL:-deepseek-v4-pro}
      - AGENT_LLM_TIMEOUT=${AGENT_LLM_TIMEOUT:-1200}
      - AGENT_LLM_CONFIG_PATH=${AGENT_LLM_CONFIG_PATH:-/app/.agent_secrets/llm_config.json}
      - AGENT_OPENAI_AGENTS_TRACING=${AGENT_OPENAI_AGENTS_TRACING:-0}
      - AGENT_DISCOVERY_MODE=${AGENT_DISCOVERY_MODE:-single_agent}
      - AGENT_MAX_MODEL_TURNS=${AGENT_MAX_MODEL_TURNS:-50}
      - AGENT_MAX_TOOL_CALLS=${AGENT_MAX_TOOL_CALLS:-100}
      - AGENT_MAX_QUERY_UNITS=${AGENT_MAX_QUERY_UNITS:-30}
      - AGENT_MAX_REPOSITORY_REQUESTS=${AGENT_MAX_REPOSITORY_REQUESTS:-200}
      - AGENT_MAX_ELAPSED_SECONDS=${AGENT_MAX_ELAPSED_SECONDS:-1200}
      - AGENT_BUDGET_AGENT_MAX_TURNS=${AGENT_BUDGET_AGENT_MAX_TURNS:-3}
      - AGENT_MAX_CONCURRENT_TASKS=${AGENT_MAX_CONCURRENT_TASKS:-2}
      - AGENT_SEARCH_THREADS=${AGENT_SEARCH_THREADS:-10}
      - AGENT_FRAGPIPE_RAM_GB=${AGENT_FRAGPIPE_RAM_GB:-0}
      - AGENT_RESULT_RETENTION_SECONDS=${AGENT_RESULT_RETENTION_SECONDS:-1800}
      - AGENT_MAX_RESULT_PROJECTS=${AGENT_MAX_RESULT_PROJECTS:-4}
      - AGENT_PROTECTED_RESULT_DIRS=${AGENT_PROTECTED_RESULT_DIRS:-baseline_validation,real_smoke,multi_mini_validation,local_validation,ai_ready_builds}
      - AGENT_WEB_FULL_WORKFLOW_ENABLED=${AGENT_WEB_FULL_WORKFLOW_ENABLED:-0}
      - AGENT_PRIDE_CACHE_DIR=${AGENT_PRIDE_CACHE_DIR:-/app/.agent_cache/pride}
      - AGENT_IPROX_INDEX_XLSX=${AGENT_IPROX_INDEX_XLSX:-/app/data/iprox.xlsx}
      - AGENT_ZIP_COMPRESS_LEVEL=${AGENT_ZIP_COMPRESS_LEVEL:-6}
      - AGENT_RUNS_DIR=/app/runs
      - AGENT_OPERATIONS_DIR=/app/runs/_operations
      - AGENT_OPERATIONS_DB=/app/runs/_operations/operations.sqlite
      - AGENT_QUEUE_DB=/app/runs/_operations/queue.sqlite
      - AGENT_OPERATIONS_ARTIFACTS=/app/runs/_operations/artifacts
      - AGENT_DISCOVERY_WORKERS=4
      - AGENT_CONTAINER_APP_DIR=/app
      - AGENT_DOCKER_VOLUMES_FROM=${AGENT_DOCKER_VOLUMES_FROM:-}
      - AGENT_HOST_APP_DIR=${AGENT_HOST_APP_DIR:-/opt/pride-agent}
      - AGENT_CONTAINER_RUNS_DIR=/app/runs
      - AGENT_HOST_RUNS_DIR=${AGENT_HOST_RUNS_DIR:-/opt/pride-agent/runs}
      - AGENT_MSDT_DOCKER_TIMEOUT_SECONDS=${AGENT_MSDT_DOCKER_TIMEOUT_SECONDS:-7200}
      - AGENT_MSDT_DOCKER_IDLE_TIMEOUT_SECONDS=${AGENT_MSDT_DOCKER_IDLE_TIMEOUT_SECONDS:-900}
      - AGENT_MSDT_ABORT_ON_LOW_PSM=${AGENT_MSDT_ABORT_ON_LOW_PSM:-1}
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/ops/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  operations-worker:
    build:
      context: .
    # image: pride-agent-all-in-one-local:latest
    container_name: pride-agent-operations-worker
    working_dir: /app
    command:
      - python
      - -m
      - huey.bin.huey_consumer
      - agent.operations.queue.huey
      - -k
      - thread
      - -w
      - "4"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AGENT_OPERATIONS_DB=/app/runs/_operations/operations.sqlite
      - AGENT_QUEUE_DB=/app/runs/_operations/queue.sqlite
      - AGENT_OPERATIONS_ARTIFACTS=/app/runs/_operations/artifacts
      - AGENT_DISCOVERY_WORKERS=4
      - AGENT_CONTAINER_APP_DIR=/app
      - AGENT_CONTAINER_RUNS_DIR=/app/runs
      - AGENT_HOST_RUNS_DIR=${AGENT_HOST_RUNS_DIR:-/opt/pride-agent/runs}
      - AGENT_PRIDE_CACHE_DIR=${AGENT_PRIDE_CACHE_DIR:-/app/.agent_cache/pride}
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    restart: unless-stopped
